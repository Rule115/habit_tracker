name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Dibagikan oleh prisma migrate deploy dan test. Service postgres di bawah.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habit_tracker_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          AUTH_DISCORD_ID: dummy
          AUTH_DISCORD_SECRET: dummy
      - run: npm audit --audit-level=high
      - run: SKIP_ENV_VALIDATION=true npm run build
